security:
    auth:
        refresh-token-ttl: P30D
    jwt:
        access-token-ttl: PT15M
        secret: ${JWT_SECRET:bG9jYWwtZGV2LXNlY3JldC1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbgo=}
spring:
    application:
        name: sb-ecom
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        password: ${DB_PASSWORD:}
        url: ${DB_URL:jdbc:mysql://localhost:3306/ecom}
        username: ${DB_USERNAME:root}
    flyway:
        baseline-on-migrate: true
        clean-disabled: false
        enabled: true
        locations: classpath:db/migration
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
    mail:
        host: ${SMTP_HOST:localhost}
        port: ${SMTP_PORT:1025}
        username: ${SMTP_USER:}
        password: ${SMTP_PASS:}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    rabbitmq:
        host: ${RABBITMQ_DEFAULT_USER:localhost}
        port: ${RABBITMQ_DEFAULT_USER:5672}
        username: ${RABBITMQ_USER:guest}
        password: ${RABBITMQ_PASS:guest}

rabbitmq:
    email:
        exchange: sbecom.email.exchange
        queues:
            welcome:
                name: sbecom.email.welcome
                routing-key: email.welcome
            password-reset:
                name: sbecom.email.password-reset
                routing-key: email.password-reset
            notification:
                name: sbecom.email.notification3
                routing-key: email.notificatiob
        dead-letter:
            exchange: sbecom.email.dlx
            queue: sbecom.email.dead-letter
            routing-key: email.dead-letter

# Custom mail properties — not part of Spring's mail config
mail:
    from:
        address: ${FROM_EMAIL:noreply@localhost}
        name: ${FROM_NAME:App}

app:
    name: ${APP_NAME:SB Ecom}
    support-email: ${SUPPORT_EMAIL:support@localhost}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    password-reset:
        token-ttl: PT15M   # 15 minutes
        reset-path: /reset-password